# Fly.io app config — Grooming SaaS backend.
# Cambia `app` al nombre que te dé `fly launch` (debe ser único en Fly.io).
# La región `scl` (Santiago) está cerca de Colombia; alternativas: `gru` (São Paulo), `mia` (Miami).

app = "api-micro-saas"
primary_region = "scl"

[build]

# Migraciones se aplican antes de cada deploy en una VM efímera.
[deploy]
  release_command = "node ./node_modules/typeorm/cli.js migration:run -d ./dist/database/data-source.js"
  strategy = "rolling"

[env]
  PORT = "3001"
  # NODE_ENV=production lo define el Dockerfile.

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"      # se duerme cuando no hay tráfico (ahorra dinero)
  auto_start_machines = true       # se despierta en el primer request (~1-2s)
  min_machines_running = 0         # cero VMs en reposo
  processes = ["app"]

# Healthcheck contra /health (que prueba la DB con SELECT 1).
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

# 256MB es lo más barato; sube a 512mb si ves OOM en `fly logs`.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
